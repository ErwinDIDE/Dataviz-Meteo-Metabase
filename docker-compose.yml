version: '3.8'

services:
  # PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: dataviz_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meteo_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Pipeline Python 
  data_pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataviz_pipeline
    network_mode: "host" 
    depends_on:
      - postgres_db

  # Metabase
  metabase:
    image: metabase/metabase:latest
    container_name: dataviz_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: meteo_data 
      MB_DB_PORT: 5432
      MB_DB_USER: admin
      MB_DB_PASS: password
      MB_DB_HOST: postgres_db
    depends_on:
      - postgres_db
    volumes:
      - metabase_data:/metabase-data

volumes:
  postgres_data:
  metabase_data: